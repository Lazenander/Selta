[package]
name = "selta-candidate-1-arbiter"
version = "0.1.0"
edition = "2021"
publish = false

# Deliberately isolate this disposable evidence tool from Selta's product
# workspace. No production crate may acquire it as a dependency.
[workspace]

[dependencies]
selta-core = { path = "../../../../../crates/selta-core" }
anyhow = "=1.0.103"
clap = { version = "=4.6.1", features = ["derive"] }
num-bigint = "=0.4.6"
num-integer = "=0.1.46"
num-traits = "=0.2.19"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
serde_json_canonicalizer = "=0.3.2"
sha2 = "=0.10.9"
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["macros", "rt"] }

[target.'cfg(unix)'.dependencies]
errno = "=0.3.14"
libc = "=0.2.186"

[dev-dependencies]
tempfile = "=3.27.0"
