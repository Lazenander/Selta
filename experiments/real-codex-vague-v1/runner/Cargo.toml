[package]
name = "selta-codex-eval"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
libc = "0.2"
selta-core = { path = "../../../crates/selta-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
wait-timeout = "0.2"
